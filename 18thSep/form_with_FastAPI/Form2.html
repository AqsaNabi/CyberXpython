<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University of Kashmir</title>
  <style>
    #btn{
      width: 25%;
      height:15% ;
      
    }
    body {
      font-family: Arial, sans-serif;
      background: #c2c4c7;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="radio"] {
      width: auto;
      margin-right: 5px;
    }
    .gender-options {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
    .submit {
      width: 100%;
      padding: 10px;
      background: #87aacf;
      color: #fff;

      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    
    h2{
      background-color: #87aacf;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>University of Kashmir</h2>
   <form id="myForm">
      

      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" name="name" required>

      <label for="fatherName">Father's Name</label>
   <input type="text" id="fatherName" name="father" required>

      <label for="motherName">Mother's Name</label>
      <input type="text" id="motherName" name="motherName" required>
      <label>Gender</label>
      <div class="gender-options">
        <label><input type="radio" name="gender" value="Male"> Male</label>
    <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
   </div>

      <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="level">Level</label>
      <select id="level" name="level">
  <option value="High School">High School</option>
        <option value="Undergraduate">Undergraduate</option>
    <option value="Postgraduate">Postgraduate</option>
      </select>

      <label for="department">Department</label>
      <select id="department" name="department">
        <option >Electrical Engineering</option>
        <option>Computer Science</option>
        <option>Mechanical Engineering</option>
        <option>Civil Engineering</option>
      </select>
   
      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" name="phone" required>
<label for="studentImage">Upload Student Image (less than 5 MB)</label>
      <input type="file" id="studentImage" name="studentImage" accept="image/*"><br>
      <button type="submit" id="btn">Submit</button>
    </form>
  </div>
  <script src="sc.js">
    
  </script>
</body>
</html>
