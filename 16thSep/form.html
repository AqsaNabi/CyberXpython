<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Patient</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
        }

        .phone {
            width: 390px;
            min-height: 844px;
            background: #fafaf8;
            border-radius: 42px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
            overflow: hidden;
        }

        /* Top status bar */
        .status-bar {
            height: 48px;
            padding: 12px 28px;

            display: flex;
            justify-content: space-between;

            font-size: 14px;
            font-weight: 600;
        }

        /* Form container */
        .form-container {
            padding: 18px 28px 36px;
        }

        /* Heading */
        h1 {
            text-align: center;
            margin: 0 0 28px;

            font-size: 30px;
            color: #111;
        }

        /* Labels */
        label {
            display: block;

            margin-bottom: 7px;

            font-size: 17px;
            font-weight: 600;

            color: #222;
        }

        /* Input fields */
        input,
        select {
            width: 100%;
            height: 40px;

            border: 1px solid #b8b8b8;
            border-radius: 5px;

            background: white;

            padding: 0 10px;
            margin-bottom: 13px;

            font-size: 16px;

            outline: none;
        }

        /* Input focus */
        input:focus,
        select:focus {
            border-color: #2878c9;

            box-shadow:
                0 0 0 2px rgba(40, 120, 201, 0.12);
        }

        /* Height + Weight */
        .two-columns {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }

        /* Save button */
        button {
            width: 100%;
            height: 50px;

            margin-top: 5px;

            border: none;
            border-radius: 7px;

            background: #1976d2;

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #1565c0;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        /* Success/Error message */
        .message {
            text-align: center;

            min-height: 20px;

            margin: 12px 0 0;

            font-size: 14px;
        }

        .success {
            color: #188038;
        }

        .error {
            color: #c5221f;
        }

        /* Mobile */
        @media (max-width: 450px) {

            body {
                background: #fafaf8;
                align-items: flex-start;
            }

            .phone {
                width: 100%;
                min-height: 100vh;

                border-radius: 0;

                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <main class="phone">

        <!-- Status bar -->
        <div class="status-bar">

            <span>9:41</span>

            <span>◔ ◔ ▰</span>

        </div>


        <section class="form-container">

            <h1>New Patient</h1>


            <!-- Patient Form -->
            <form id="patientForm">

                <!-- ID -->
                <label for="id">
                    ID
                </label>

                <input
                    id="id"
                    name="id"
                    type="text"
                    required
                >


                <!-- Name -->
                <label for="name">
                    Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    required
                >


                <!-- City -->
                <label for="city">
                    City
                </label>

                <input
                    id="city"
                    name="city"
                    type="text"
                    required
                >


                <!-- Age -->
                <label for="age">
                    Age
                </label>

                <input
                    id="age"
                    name="age"
                    type="number"
                    min="0"
                    max="150"
                    required
                >


                <!-- Gender -->
                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option value="male">
                        male
                    </option>

                    <option value="female">
                        female
                    </option>

                    <option value="other">
                        other
                    </option>

                </select>


                <!-- Height and Weight -->
                <div class="two-columns">

                    <div>

                        <label for="height">
                            Height
                        </label>

                        <input
                            id="height"
                            name="height"
                            type="number"
                            step="0.1"
                            min="0"
                            required
                        >

                    </div>


                    <div>

                        <label for="weight">
                            Weight
                        </label>

                        <input
                            id="weight"
                            name="weight"
                            type="number"
                            step="0.1"
                            min="0"
                            required
                        >

                    </div>

                </div>


                <!-- Save -->
                <button type="submit">
                    SAVE
                </button>


                <!-- Message -->
                <p
                    id="message"
                    class="message"
                ></p>

            </form>

        </section>

    </main>


    <!-- JavaScript -->
    <script>

        // Get the form
        const form = document.getElementById("patientForm");

        // Get message element
        const message = document.getElementById("message");

        // Get save button
        const saveButton = form.querySelector("button");


        // When form is submitted
        form.addEventListener("submit", async function(event) {

            // Prevent normal HTML form submission
            event.preventDefault();


            /*
                Collect data from the form
            */

            const data = {

                id: document.getElementById("id").value.trim(),

                name: document.getElementById("name").value.trim(),

                city: document.getElementById("city").value.trim(),

                age: Number(
                    document.getElementById("age").value
                ),

                gender: document.getElementById("gender").value,

                height: Number(
                    document.getElementById("height").value
                ),

                weight: Number(
                    document.getElementById("weight").value
                )

            };


            // Clear previous message
            message.textContent = "";

            message.className = "message";


            // Disable button while saving
            saveButton.disabled = true;


            try {

                /*
                    Send data to FastAPI
                */

                const response = await fetch(
                    "/api/patients",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                /*
                    Convert FastAPI response
                    into JavaScript object
                */

                const result = await response.json();


                /*
                    Check if FastAPI returned an error
                */

                if (!response.ok) {

                    const detail =
                        Array.isArray(result.detail)

                        ? result.detail
                            .map(error => error.msg)
                            .join(", ")

                        : result.detail;


                    throw new Error(
                        detail || "Unable to save patient"
                    );
                }


                /*
                    Success
                */

                message.textContent =
                    "Patient saved successfully!";

                message.classList.add("success");


                /*
                    Clear the form
                */

                form.reset();


                /*
                    Set gender back to male
                */

                document.getElementById("gender").value =
                    "male";


            }

            catch (error) {

                /*
                    Display error
                */

                message.textContent =
                    error.message;

                message.classList.add("error");

            }

            finally {

                /*
                    Enable button again
                */

                saveButton.disabled = false;

            }

        });

    </script>

</body>
</html>
